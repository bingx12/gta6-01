<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veldora Bay — an open-world crime game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ff9e57'/%3E%3Ccircle cx='16' cy='20' r='7' fill='%23ffd23e'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff3e0; z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #stars { font-size: 26px; letter-spacing: 3px; text-shadow: 0 2px 4px #000; }
  #cash { font-size: 26px; font-weight: 800; color: #7dff8a; text-shadow: 0 2px 4px #000; }
  #clock { font-size: 16px; opacity: 0.9; text-shadow: 0 1px 3px #000; }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; max-width: 380px; }
  #objective { background: rgba(20,14,10,0.62); padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 15px; }
  #mission-list { margin-top: 8px; background: rgba(20,14,10,0.5); padding: 8px 12px; border-radius: 8px; font-size: 13px; text-align: left; }
  .mission-row { padding: 1px 0; opacity: 0.75; }
  .mission-row.current { opacity: 1; color: #ffd23e; font-weight: 700; }
  #hud-bottom-left { position: absolute; left: 16px; bottom: 14px; }
  #health-bar { width: 220px; height: 20px; background: rgba(0,0,0,0.6); border: 1px solid #fff3e0; border-radius: 4px; position: relative; }
  #health-fill { height: 100%; width: 100%; background: #4ade80; }
  #health-text { position: absolute; inset: 0; text-align: center; font-size: 13px; font-weight: 700; line-height: 20px; text-shadow: 0 1px 2px #000; }
  #speed { font-size: 22px; font-weight: 800; margin-top: 6px; text-shadow: 0 2px 4px #000; }
  #hint { font-size: 12px; opacity: 0.85; margin-top: 4px; text-shadow: 0 1px 2px #000; }
  #minimap { position: absolute; right: 16px; bottom: 14px; border: 2px solid rgba(255,243,224,0.8); border-radius: 50%; background: #0e1a24; }
  #dialogue { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); max-width: 640px; background: rgba(20,14,10,0.78); padding: 12px 18px; border-radius: 10px; font-size: 15px; line-height: 1.45; opacity: 0; transition: opacity 0.3s; text-align: center; }
  #dialogue.show { opacity: 1; }
  #banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 30px; font-weight: 900; color: #ffd23e; text-shadow: 0 3px 8px #000; opacity: 0; transition: opacity 0.3s; text-align: center; white-space: nowrap; }
  #banner.show { opacity: 1; }
  #menu, #overlay, #pause-menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,6,4,0.55); pointer-events: auto; }
  .hidden { display: none !important; }
  .menu-card { background: rgba(24,14,10,0.92); border: 1px solid #ff9e57; border-radius: 16px; padding: 32px 40px; text-align: center; max-width: 560px; }
  .menu-card h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: 4px; color: #ffd23e; }
  .menu-card .tagline { font-size: 17px; margin: 0 0 14px; }
  .menu-card .controls { font-size: 14px; line-height: 1.7; opacity: 0.9; }
  .menu-card .small { font-size: 12px; opacity: 0.65; margin-top: 16px; }
  .menu-card button, #overlay button { pointer-events: auto; cursor: pointer; display: block; margin: 10px auto 0; padding: 12px 28px; font-size: 17px; font-weight: 800; border: none; border-radius: 10px; background: #ffd23e; color: #241408; min-width: 240px; }
  .menu-card button:hover, #overlay button:hover { background: #ffdf6e; }
  #overlay { flex-direction: column; background: rgba(20,0,0,0.45); text-align: center; }
  #overlay h1 { font-size: 72px; letter-spacing: 8px; color: #ff4d4d; margin: 0; text-shadow: 0 4px 12px #000; }
  #overlay p { font-size: 18px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
